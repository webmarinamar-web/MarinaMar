backend:
  name: github
  repo: webmarinamar-web/MarinaMar
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth

media_folder: "images"
public_folder: "images"

locale: "es"

collections:
  - name: "contenido"
    label: "Contenido de la web"
    files:

      - file: "content/datos.json"
        label: "Textos y contacto"
        name: "datos"
        fields:
          - label: "Inicio"
            name: "textos"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Título portada", name: "titulo_inicio", widget: "string" }
              - { label: "Subtítulo portada", name: "subtitulo_inicio", widget: "text" }
              - { label: "Título sección 'El sitio'", name: "inicio_espacio_titulo", widget: "string" }
              - { label: "Texto sección 'El sitio'", name: "inicio_espacio_texto", widget: "text" }
              - { label: "Título sección 'Alrededor'", name: "inicio_alrededor_titulo", widget: "string" }
              - { label: "Texto sección 'Alrededor'", name: "inicio_alrededor_texto", widget: "text" }
              - { label: "Título cierre Inicio", name: "inicio_cierre_titulo", widget: "string" }
              - { label: "Texto cierre Inicio", name: "inicio_cierre_texto", widget: "text" }
              - { label: "Título portada Alojamiento", name: "alojamiento_titulo", widget: "string" }
              - { label: "Texto ubicación", name: "alojamiento_ubicacion_texto", widget: "text" }
              - { label: "URL del mapa (insertar de Google Maps)", name: "mapa_src", widget: "string", required: false, hint: "En Google Maps: Compartir → Insertar un mapa → copia solo la URL de dentro de src=\"...\"" }
              - { label: "Aviso pendiente (mapa)", name: "alojamiento_ubicacion_pendiente", widget: "text" }
              - { label: "Título cierre Alojamiento", name: "alojamiento_cierre_titulo", widget: "string" }
              - { label: "Texto cierre Alojamiento", name: "alojamiento_cierre_texto", widget: "text" }
              - { label: "Texto intro Tarifas", name: "tarifas_intro_texto", widget: "text" }
              - { label: "Precio temporada alta", name: "precio_alta", widget: "string" }
              - { label: "Nota temporada alta", name: "tarifas_nota_alta", widget: "text" }
              - { label: "Precio temporada media", name: "precio_media", widget: "string" }
              - { label: "Nota temporada media", name: "tarifas_nota_media", widget: "text" }
              - { label: "Nota temporada cerrada", name: "tarifas_nota_cerrada", widget: "string" }
              - { label: "Aviso pendiente (tarifas)", name: "tarifas_pendiente", widget: "text" }
              - { label: "Título cierre Tarifas", name: "tarifas_cierre_titulo", widget: "string" }
              - { label: "Texto cierre Tarifas", name: "tarifas_cierre_texto", widget: "text" }
              - { label: "Título portada Actividades", name: "actividades_titulo", widget: "string" }
              - { label: "Texto intro Actividades", name: "actividades_intro_texto", widget: "text" }
              - { label: "Título cierre Actividades", name: "actividades_cierre_titulo", widget: "string" }
              - { label: "Texto cierre Actividades", name: "actividades_cierre_texto", widget: "text" }
              - { label: "Título Reservas", name: "reservas_titulo", widget: "string" }
              - { label: "Texto intro Reservas", name: "reservas_intro_texto", widget: "text" }
              - { label: "Título 'Plataformas de reserva'", name: "reservas_plataformas_titulo", widget: "string" }
              - { label: "Texto 'Plataformas de reserva'", name: "reservas_plataformas_texto", widget: "text" }
              - { label: "Aviso pendiente (reservas)", name: "reservas_pendiente", widget: "text" }
              - { label: "Teléfono 1", name: "telefono1", widget: "string" }
              - { label: "Teléfono 2", name: "telefono2", widget: "string" }
              - { label: "Correo 1", name: "correo1", widget: "string" }
              - { label: "Correo 2", name: "correo2", widget: "string" }
              - { label: "Descripción en el pie", name: "pie_descripcion", widget: "text" }
              - { label: "Copyright / REAT (pie)", name: "pie_copyright", widget: "string" }
          - label: "Enlaces"
            name: "enlaces"
            widget: "object"
            collapsed: true
            fields:
              - { label: "WhatsApp (enlace completo de wa.me)", name: "whatsapp", widget: "string" }
              - { label: "Booking", name: "booking", widget: "string" }
              - { label: "Airbnb", name: "airbnb", widget: "string", required: false }
              - { label: "Rentalia", name: "rentalia", widget: "string", required: false }

      - file: "content/fotos.json"
        label: "Fotos de portada"
        name: "fotos"
        fields:
          - { label: "Logotipo (cabecera)", name: "logo", widget: "image", required: false, hint: "Si lo subes, sustituye al texto 'MarinaMar Camariñas' en la cabecera. Recomendado: fondo transparente (PNG), altura ~80px." }
          - { label: "Portada · Inicio", name: "portada_inicio", widget: "image", required: false }
          - { label: "Portada · Alojamiento", name: "portada_alojamiento", widget: "image", required: false }
          - { label: "Portada · Actividades", name: "portada_actividades", widget: "image", required: false }

      - file: "content/listas.json"
        label: "Listas de contenido"
        name: "listas"
        fields:
          - label: "Destacados de Inicio (3 tarjetas)"
            name: "inicio_destacados"
            widget: "list"
            fields:
              - { label: "Título", name: "titulo", widget: "string" }
              - { label: "Descripción", name: "descripcion", widget: "string" }
              - { label: "Foto", name: "foto", widget: "image", required: false }
          - label: "Habitaciones (página Alojamiento)"
            name: "habitaciones"
            widget: "list"
            fields:
              - { label: "Título", name: "titulo", widget: "string" }
              - { label: "Descripción", name: "descripcion", widget: "string" }
              - { label: "Foto", name: "foto", widget: "image", required: false }
          - label: "Lista 'Qué hay' (distribución)"
            name: "distribucion"
            widget: "list"
            field: { label: "Línea", name: "linea", widget: "string" }
          - label: "Lista 'Qué está incluido' (servicios)"
            name: "servicios"
            widget: "list"
            field: { label: "Línea", name: "linea", widget: "string" }
          - label: "Preguntas frecuentes"
            name: "faq"
            widget: "list"
            fields:
              - { label: "Pregunta", name: "pregunta", widget: "string" }
              - { label: "Respuesta", name: "respuesta", widget: "text" }
          - label: "Condiciones (tarifas)"
            name: "condiciones"
            widget: "list"
            field: { label: "Línea", name: "linea", widget: "string" }
          - label: "Actividades y visitas"
            name: "actividades"
            widget: "list"
            fields:
              - { label: "Etiqueta", name: "eyebrow", widget: "string" }
              - { label: "Título", name: "titulo", widget: "string" }
              - { label: "Texto", name: "texto", widget: "text" }
              - { label: "Enlace: texto", name: "enlace_texto", widget: "string", required: false }
              - { label: "Enlace: URL", name: "enlace_url", widget: "string", required: false }
              - { label: "Segundo enlace: texto", name: "enlace2_texto", widget: "string", required: false }
              - { label: "Segundo enlace: URL", name: "enlace2_url", widget: "string", required: false }
          - label: "Lista 'Lo básico' (reservas)"
            name: "lo_basico"
            widget: "list"
            field: { label: "Línea", name: "linea", widget: "string" }
